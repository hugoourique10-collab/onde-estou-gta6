html{color-scheme:dark}

main{max-width:820px;margin:0 auto;padding:18px 16px 48px}
button,a{font:inherit;color:inherit;text-shadow:inherit}
:is(button,a,input):focus-visible{outline:2px solid #fff;outline-offset:2px}
.glass,.card,.blk,.m,.overall,.tab,.back,#burger{border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#burger{position:fixed;z-index:30;top:14px;left:14px;width:44px;height:44px;border-radius:12px;font-size:1.3rem;line-height:1;cursor:pointer}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(300px,84vw);padding:70px 14px 20px;display:flex;flex-direction:column;gap:6px;background:rgba(24,26,36,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--edge);transform:translateX(-100%);visibility:hidden;transition:transform .28s,visibility .28s}
#drawer a{padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:500}
#drawer a:hover,#drawer a.on{background:var(--paper);color:var(--ink);text-shadow:none}
body.nav #drawer{transform:none;visibility:visible}
body.nav #scrim{opacity:1;visibility:visible}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:center;padding:40px 0 18px;text-align:center}
.logo{width:96px;height:auto;flex:none}
h1{margin:0;font-size:clamp(1.5rem,5.5vw,2.15rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.by{margin:4px 0 0;font-size:.95rem;font-weight:500;color:var(--mute)}
h2{margin:6px 0 4px;font-size:1.5rem;font-weight:700}
h3{margin:0 0 8px;font-size:1.05rem;font-weight:600}
.lead{margin:0 0 16px;color:var(--mute)}
.view{display:none}
.view.on{display:block}
.hub{display:grid;gap:12px;margin-top:8px}
.card{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;text-decoration:none;transition:background .2s,color .2s}
.card svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-weight:600;font-size:1.05rem}
.card span{font-size:.9rem;opacity:.75}
.card:hover,.card:focus-visible{background:var(--paper);color:var(--ink);text-shadow:none}
.back{display:inline-block;margin:0 0 14px;padding:8px 14px;border-radius:10px;text-decoration:none;font-size:.92rem;font-weight:500;transition:background .2s,color .2s}
.back:hover{background:var(--paper);color:var(--ink);text-shadow:none}
.blk{padding:16px 18px;border-radius:14px;margin-bottom:12px}
.blk ul{margin:0;padding-left:20px;display:grid;gap:8px}
.note{margin:14px 2px 0;color:var(--mute);font-size:.88rem}
.overall{margin:6px 0 18px;padding:14px 16px;border-radius:14px}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;color:var(--mute)}
.ov-head strong{font-size:1.6rem;font-weight:700;color:#fff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--salmon));transition:width .4s}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px}
.tab{flex:1 0 auto;min-width:104px;padding:9px 12px;border-radius:12px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.tab em{display:block;font-style:normal;font-size:.82rem;font-weight:400;opacity:.7}
.tab:hover,.tab.on{background:var(--paper);color:var(--ink);text-shadow:none}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 16px;margin:8px 2px 12px}
.chead h2{margin:0;font-size:1.15rem}
#chCount{color:var(--mute);font-size:.9rem}
ul.l{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.m{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"n t r c";gap:6px 14px;align-items:center;padding:13px 16px;border-radius:14px}
.m.done{background:rgba(255,255,255,.1)}
.num{grid-area:n;font-weight:700;color:var(--rose);font-variant-numeric:tabular-nums;min-width:3ch}
.txt{grid-area:t;min-width:0;cursor:pointer;filter:blur(7px);user-select:none;-webkit-user-select:none;transition:filter .25s}
.m.rev .txt{filter:none;user-select:text;-webkit-user-select:text}
.txt h3{margin:0;font-size:1rem}
.txt p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.m.done h3{text-decoration:line-through;color:var(--mute)}
.rv{grid-area:r;padding:6px 12px;border:1px solid var(--edge);border-radius:8px;background:transparent;font-size:.85rem;font-weight:500;cursor:pointer}
.rv:hover{background:var(--paper);color:var(--ink);text-shadow:none}
.chk{grid-area:c;display:flex}
input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;display:grid;place-content:center;border:1.5px solid rgba(255,255,255,.55);border-radius:7px;background:transparent;cursor:pointer}
input[type=checkbox]:checked{background:var(--paper);border-color:var(--paper)}
input[type=checkbox]:checked::after{content:"✓";color:var(--ink);font-weight:700;font-size:.95rem;line-height:1}
.sum{display:none;grid-column:1/-1;margin-top:4px;padding:10px 14px;border-left:2px solid var(--salmon);border-radius:0 10px 10px 0;background:rgba(255,255,255,.05);animation:sin .3s}
.m.done .sum{display:block}
.sum strong{font-weight:600;color:var(--salmon)}
.sum p{margin:3px 0 0;font-size:.93rem}
@keyframes sin{from{opacity:0;transform:translateY(-4px)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--edge)}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--mute);font-size:.84rem}
.chip{flex:none;padding:3px 10px;border:1px dashed rgba(255,255,255,.35);border-radius:99px;font-size:.78rem;color:var(--mute)}
label.an{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--edge);cursor:pointer}
label.an:first-of-type{border-top:0}
.add{display:flex;gap:8px;margin-top:6px}
.add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--glass);color:#fff;font:inherit}
.add button{padding:10px 16px;border:1px solid var(--edge);border-radius:10px;background:var(--glass);font-weight:600;cursor:pointer}
.add button:hover{background:var(--paper);color:var(--ink);text-shadow:none}
.foot{margin-top:28px;text-align:center}
#reset{padding:4px 8px;border:0;background:none;font-size:.85rem;color:var(--mute);text-decoration:underline;cursor:pointer}
@media (max-width:520px){.m{grid-template-columns:auto 1fr auto;grid-template-areas:"n t c" ". r r"}.rv{justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    li.querySelector(".sum p").textContent = SUM[id - 1] || "";
    sync(li);
    list.appendChild(li);
  });
}
list.addEventListener("click", function (e) {
  var li = e.target.closest(".m");
  if (!li || !(e.target.closest(".txt") || e.target.closest(".rv"))) return;
  var id = li.dataset.id;
  if (S.rev[id]) delete S.rev[id]; else S.rev[id] = 1;
  save(); sync(li);
});
list.addEventListener("change", function (e) {
  var li = e.target.closest(".m");
  if (!li) return;
  var id = li.dataset.id;
  if (e.target.checked) { S.done[id] = 1; S.rev[id] = 1; } else { delete S.done[id]; }
  save(); sync(li); paint();
});
tabs.addEventListener("click", function (e) {
  var b = e.target.closest(".tab");
  if (!b) return;
  S.ch = parseInt(b.dataset.ch, 10);
  save(); renderList(); paint();
});
$("#reset").addEventListener("click", function () {
  if (confirm("Resetar o progresso das missões? As missões concluídas e reveladas serão apagadas deste navegador.")) {
    S.done = {}; S.rev = {}; S.ch = 0;
    save(); renderList(); paint();
  }
});

renderList();
paint();
route();
})();
</script>
<link rel="stylesheet" href="patch.css">
<script src="enciclopedia.js"></script>
</body>
</html>
